<!DOCTYPE html>

<head>

  <title>Amogh's College Application Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f6fa; color: #1a1a2e; min-height: 100vh; }
    header { background: #1a1a2e; color: #fff; padding: 2rem 1.5rem 1.5rem; text-align: center; }
    header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; }
    header p  { margin-top: 0.4rem; font-size: 0.95rem; opacity: 0.65; }
    #last-updated { text-align: center; font-size: 0.8rem; color: #888; padding: 0.6rem; background: #eef0f7; border-bottom: 1px solid #dde0ee; }
    #stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; padding: 1.5rem; background: #fff; border-bottom: 1px solid #e4e6f0; }
    .stat-card { text-align: center; min-width: 90px; }
    .stat-card .num { font-size: 2rem; font-weight: 700; }
    .stat-card .lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.55; margin-top: 0.2rem; }

    .section-title { max-width: 1200px; margin: 1.8rem auto 0.6rem; padding: 0 1.5rem; font-size: 0.95rem; font-weight: 700; color: #444; text-transform: uppercase; letter-spacing: 0.05em; }
    .panel-wrap { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .panel { background: #fff; border: 1px solid #e4e6f0; border-radius: 12px; padding: 1rem 1.2rem; }
    .panel h3 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 0.7rem; }
    .panel ul { list-style: none; }
    .panel li { font-size: 0.85rem; padding: 0.45rem 0; border-top: 1px solid #f0f0f5; line-height: 1.4; }
    .panel li:first-child { border-top: none; }
    .panel .who { display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #6e76a8; background: #eef0f7; border-radius: 10px; padding: 0.1rem 0.5rem; margin-right: 0.4rem; }
    .panel .due { float: right; font-size: 0.72rem; color: #b06500; font-weight: 600; }
    .panel.overdue .due { color: #c0392b; }
    .panel .note { font-size: 0.78rem; color: #888; margin-top: 0.6rem; line-height: 1.4; }

    #filters { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 1rem 1.5rem; background: #fff; border-bottom: 1px solid #e4e6f0; margin-top: 1.5rem; }
    .filter-btn { padding: 0.3rem 0.9rem; border: 1.5px solid #dde0ee; border-radius: 20px; background: #fff; font-size: 0.82rem; cursor: pointer; transition: all 0.15s; }
    .filter-btn:hover, .filter-btn.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; border: 1px solid #e4e6f0; padding: 1.2rem 1.3rem; transition: transform 0.15s, box-shadow 0.15s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.7rem; }
    .card-header h2 { font-size: 1rem; font-weight: 700; line-height: 1.3; }
    .card-header .location { font-size: 0.78rem; opacity: 0.5; margin-top: 0.15rem; }
    .badge { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.25rem 0.6rem; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
    .badge-planning { background: #eef0f7; color: #6e76a8; }
    .badge-in-progress { background: #fff4e5; color: #b06500; }
    .badge-submitted { background: #e5f4ff; color: #005fb8; }
    .badge-deferred { background: #f0f0f0; color: #666; }
    .badge-waitlisted { background: #fff8e1; color: #8a6000; }
    .badge-accepted { background: #e6f9ee; color: #1a7d3e; }
    .badge-rejected { background: #fdecea; color: #b91c1c; }
    .badge-enrolled { background: #1a1a2e; color: #fff; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; font-size: 0.8rem; color: #555; margin-bottom: 0.6rem; }
    .card-meta span::before { content: attr(data-icon) " "; }
    .deadline { font-size: 0.78rem; font-weight: 600; }
    .deadline.soon { color: #c05000; }
    .deadline.ok { color: #1a7d3e; }
    .deadline.past { color: #888; text-decoration: line-through; }
    .deadline.tbd { color: #999; font-style: italic; }
    .notes { font-size: 0.8rem; color: #666; line-height: 1.5; border-top: 1px solid #f0f0f5; margin-top: 0.7rem; padding-top: 0.7rem; }
    #empty { display: none; text-align: center; padding: 4rem 1rem; color: #aaa; grid-column: 1 / -1; }
    footer { text-align: center; font-size: 0.75rem; color: #bbb; padding: 2rem 1rem; }
  </style>
</head>

<header>
  <h1 id="page-title">College Application Tracker</h1>
  <p id="page-subtitle"></p>
</header>
<div id="last-updated"></div>
<div id="stats">
  <div class="stat-card"><div class="num" id="s-total">0</div><div class="lbl">Total</div></div>
  <div class="stat-card"><div class="num" id="s-submitted">0</div><div class="lbl">Submitted</div></div>
  <div class="stat-card"><div class="num" id="s-accepted">0</div><div class="lbl">Accepted</div></div>
  <div class="stat-card"><div class="num" id="s-pending">0</div><div class="lbl">Pending</div></div>
</div>

<div class="section-title">Status</div>
<div class="panel-wrap">
  <div class="panel overdue">
    <h3>Overdue</h3>
    <ul id="p-overdue"></ul>
  </div>
  <div class="panel">
    <h3>This Week (17&ndash;24 Aug)</h3>
    <ul id="p-thisweek"></ul>
  </div>
  <div class="panel">
    <h3>School List</h3>
    <div class="note" id="p-note"></div>
  </div>
</div>

<div id="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="planning">Planning</button>
  <button class="filter-btn" data-filter="in-progress">In Progress</button>
  <button class="filter-btn" data-filter="submitted">Submitted</button>
  <button class="filter-btn" data-filter="accepted">Accepted</button>
</div>
<div id="grid"><div id="empty">No applications match this filter.</div></div>
<footer>Updated by Cowork &middot; <span id="footer-date"></span></footer>
<script>
(function(){
  var raw=document.getElementById('college-data-store').textContent;
  var data=JSON.parse(raw);
  var meta=data.meta, apps=data.applications, status=data.status||{};
  document.getElementById('page-title').textContent=(meta.studentName||'Student')+"'s College Application Tracker";
  document.getElementById('page-subtitle').textContent=meta.cycle||'';
  document.getElementById('last-updated').textContent='Last updated: '+(meta.lastUpdated||'-')+(meta.updatedBy?'  ·  '+meta.updatedBy:'');
  document.getElementById('footer-date').textContent=meta.lastUpdated||'';
  var BADGE={planning:'badge-planning','in-progress':'badge-in-progress',submitted:'badge-submitted',deferred:'badge-deferred',waitlisted:'badge-waitlisted',accepted:'badge-accepted',rejected:'badge-rejected',enrolled:'badge-enrolled'};
  var LABEL={planning:'Planning','in-progress':'In Progress',submitted:'Submitted',deferred:'Deferred',waitlisted:'Waitlisted',accepted:'Accepted',rejected:'Rejected',enrolled:'Enrolled'};
  var SUB=['submitted','deferred','waitlisted','accepted','rejected','enrolled'];
  var PEN=['planning','in-progress'];
  document.getElementById('s-total').textContent=apps.length;
  document.getElementById('s-submitted').textContent=apps.filter(function(a){return SUB.indexOf(a.status)>-1;}).length;
  document.getElementById('s-accepted').textContent=apps.filter(function(a){return a.status==='accepted'||a.status==='enrolled';}).length;
  document.getElementById('s-pending').textContent=apps.filter(function(a){return PEN.indexOf(a.status)>-1;}).length;
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function dc(d){if(!d)return'tbd';var dt=new Date(d),now=new Date();if(dt<now)return'past';return((dt-now)/864e5)<30?'soon':'ok';}
  function fd(d){if(!d)return'TBD';return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}

  var ol=document.getElementById('p-overdue');
  (status.overdue||[]).forEach(function(o){
    var li=document.createElement('li');
    li.innerHTML='<span class="who">'+esc(o.who)+'</span>'+esc(o.item)+'<span class="due">was due '+fd(o.wasDue)+'</span>';
    ol.appendChild(li);
  });
  var tw=document.getElementById('p-thisweek');
  (status.thisWeek||[]).forEach(function(o){
    var li=document.createElement('li');
    li.innerHTML='<span class="who">'+esc(o.who)+'</span>'+esc(o.item)+'<span class="due">due '+fd(o.due)+'</span>';
    tw.appendChild(li);
  });
  document.getElementById('p-note').textContent=status.note||'';

  var grid=document.getElementById('grid');
  var empty=document.getElementById('empty');
  function render(f){
    Array.from(grid.querySelectorAll('.card')).forEach(function(c){c.remove();});
    var filtered=apps.filter(function(a){ return f==='all' || a.status===f; });
    empty.style.display=filtered.length===0?'block':'none';
    filtered.forEach(function(app){
      var card=document.createElement('div');
      card.className='card';
      card.innerHTML='<div class="card-header"><div><h2>'+esc(app.school)+'</h2>'+(app.location?'<div class="location">'+esc(app.location)+'</div>':'')+'</div><span class="badge '+(BADGE[app.status]||'badge-planning')+'">'+esc(LABEL[app.status]||app.status)+'</span></div><div class="card-meta">'+(app.appType?'<span data-icon="doc">'+esc(app.appType)+'</span>':'')+'</div><div class="deadline '+dc(app.deadline)+'">Deadline: '+fd(app.deadline)+'</div>'+(app.notes?'<div class="notes">'+esc(app.notes)+'</div>':'');
      grid.appendChild(card);
    });
  }
  document.getElementById('filters').addEventListener('click',function(e){
    var btn=e.target.closest('.filter-btn');
    if(!btn)return;
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
  render('all');
})();
</script>
</body>
</html>
